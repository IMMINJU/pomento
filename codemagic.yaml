# Codemagic 빌드 설정.
#
# 안드로이드는 지금 바로 돌아간다. iOS는 준비가 더 필요하다. 아래 순서대로
# 하는 것이 실패를 가장 적게 겪는 길이다.
#
#   1) ios-compile 워크플로를 먼저 돌린다. 애플 계정 없이도 되고, iOS 코드가
#      실제로 컴파일되는지만 확인한다.
#   2) Apple Developer Program 개인 가입.
#   3) App Store Connect에서 API 키를 만들고, Codemagic의
#      Teams > Integrations > App Store Connect에 `pomento-asc` 이름으로 등록.
#   4) App Store Connect에서 앱 레코드 생성 (번들 ID com.pomento.app).
#      이건 API로 못 만든다. 애플이 막아뒀다.
#   5) TestFlight에 내부 테스트 그룹 `Pomento Internal`을 만들고 테스터 추가.
#   6) ios-testflight 워크플로 실행.
#
# 서명은 자동 방식 한 가지만 쓴다. environment.ios_signing은 이미 있는
# 프로파일을 가져오기만 하고 만들지는 않는다. 두 방식을 섞으면
# "No matching profiles found"로 죽는다.

definitions:
  base_env: &base_env
    flutter: stable
    xcode: latest
    java: 21

  # 스텝은 하나씩 앵커를 단다. 리스트 앵커를 리스트 안에 넣으면 중첩돼서
  # Codemagic이 못 읽는다.
  pub_get: &pub_get
    name: 의존성 받기
    script: flutter pub get
  codegen: &codegen
    name: drift 코드 생성
    script: dart run build_runner build
  analyze: &analyze
    name: 정적 분석
    script: flutter analyze lib test
  unit_test: &unit_test
    name: 단위 테스트
    script: flutter test

workflows:
  android:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      <<: *base_env
    scripts:
      - *pub_get
      - *codegen
      - *analyze
      - *unit_test
      - name: APK 빌드
        script: flutter build apk --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.apk

  ios-compile:
    # 서명 없이 컴파일만 확인한다. 애플 계정이 준비되기 전에 iOS 쪽 코드가
    # 깨지지 않았는지 보려는 용도라 여기부터 돌리는 것이 좋다.
    name: iOS 컴파일 확인
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *base_env
    scripts:
      - *pub_get
      - *codegen
      - *analyze
      - *unit_test
      - name: 서명 없이 빌드
        script: flutter build ios --release --no-codesign

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: pomento-asc
    environment:
      <<: *base_env
      # CERTIFICATE_PRIVATE_KEY가 이 그룹에 들어 있다. Codemagic의
      # Environment variables에서 그룹 이름을 ios_signing으로 만든다.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.pomento.app"
    scripts:
      - *pub_get
      - *codegen
      - *analyze
      - *unit_test
      # 인증서는 개인 키와 짝이다. 애플 계정에 인증서가 있어도 그 키가
      # 없으면 키체인에 넣을 수 없다. 다른 앱을 만들며 생긴 인증서가 이미
      # 있으면 fetch-signing-files가 그것을 찾고는 이렇게 적고 만다.
      #
      #   Cannot save Signing Certificates without certificate private key
      #
      # 그래서 우리가 가진 키를 넘겨 새 인증서를 만들게 한다.
      # CERTIFICATE_PRIVATE_KEY는 환경 변수 그룹 ios_signing에 넣어둔 RSA
      # 개인 키다. 이 키가 늘 같아야 인증서가 하나로 유지된다. 빌드마다
      # 새로 만들면 애플 상한인 배포 인증서 3개에 사흘이면 닿는다.
      #
      # set -e가 없으면 위 오류가 나도 단계가 초록으로 지나간다. 여러 줄
      # 스크립트는 마지막 명령의 종료 코드만 보기 때문이다. 그러면 빈
      # export_options.plist를 들고 아카이브까지 가서 거기서 죽는다.
      - name: 서명 파일 준비
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          # 서명할 수 있는 상태인지 여기서 확인하고 끝낸다. 비어 있으면
          # 아카이브까지 가지 않고 이 자리에서 멈춘다.
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "1 valid identities found\|[2-9] valid identities found"
      - name: IPA 빌드
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # 내부 테스터는 심사 없이 바로 설치할 수 있다. 그룹 이름은 App Store
        # Connect에서 만든 것과 글자까지 같아야 한다.
        submit_to_testflight: true
        beta_groups:
          - Pomento Internal
